}

function matchCountry(c, filter) {
  if (!filter) return true;
  if (filter === "中国") return c.includes("中国");
  if (filter === "美国") return c.includes("美国");
  if (filter === "欧洲") return /德|法|英|荷|比|瑞|爱尔兰|丹/.test(c);
  if (filter === "亚太") return /新加坡|澳大利亚|印度尼西亚/.test(c);
  return true;
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  const iv = intEl.value;
  const cv = ctyEl.value;
  const freshOnly = freshEl.checked;
  const rows = JOBS.filter(j => {
    if (freshOnly && !j[8]) return false;
    const text = j.join(" ").toLowerCase();
    if (q && !text.includes(q)) return false;
    if (iv === "低" && !(j[4].includes("较低") || j[4].includes("中低"))) return false;
    if (iv === "中" && !j[4].startsWith("中等")) return false;
    if (iv === "偏高" && !(j[4].includes("偏高") || j[4].includes("高"))) return false;
    if (!matchCountry(j[2], cv)) return false;
    return true;
  });
  statsEl.textContent = `当前显示 ${rows.length} / ${JOBS.length} 家`;
  const tc = document.getElementById("totalCount");
  if (tc) tc.textContent = JOBS.length;
  tbody.innerHTML = rows.map(j => `
    <tr>
      <td>${j[0]}</td>
      <td><strong>${j[1]}</strong></td>
      <td>${j[2]}</td>
      <td>${j[3]}</td>
      <td><span class="badge ${badgeClass(j[4])}">${j[4]}</span></td>
      <td>${j[5]}</td>
      <td>${j[6]}</td>
      <td><span class="badge ${j[8] ? "b-fresh" : "b-mid"}">${j[7]}</span></td>
      <td><a class="src" href="${j[9]}" target="_blank" rel="noopener noreferrer">${j[9]}</a></td>
    </tr>
  `).join("");
}

qEl.addEventListener("input", render);
intEl.addEventListener("change", render);
ctyEl.addEventListener("change", render);
freshEl.addEventListener("change", render);

const root = document.documentElement;
const savedTheme = localStorage.getItem("interview-notes-theme");
if (savedTheme === "dark") root.setAttribute("data-theme", "dark");
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  if (next === "dark") root.setAttribute("data-theme", "dark");
  else root.removeAttribute("data-theme");
  localStorage.setItem("interview-notes-theme", next);
});

render();
</script>
</body>
</html>
